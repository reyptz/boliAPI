version: '3.8'

services:
  postgres:
    image: postgis/postgis:latest
    container_name: boli_postgres
    environment:
      POSTGRES_USER: boli_user
      POSTGRES_PASSWORD: boli_password
      POSTGRES_DB: boli_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:latest
    container_name: boli_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:latest
    container_name: boli_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: boli_user
      RABBITMQ_DEFAULT_PASS: boli_password
    ports:
      - "5672:5672"   # Port principal RabbitMQ
      - "15672:15672" # Interface d'administration Web
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:


